[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-qwen-image"
version = "0.1.0"
description = "Qwen-Image-2.1 generation, editing, composition and subject isolation with a web UI, HTTP API and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision",
    # QwenImage21Pipeline is only on diffusers main at the time of writing.
    "diffusers @ git+https://github.com/huggingface/diffusers",
    "transformers>=5.17",
    "accelerate",
    "huggingface_hub",
    "gguf",
    # ControlNet preprocessors (pose, HED, line art, MLSD); pulls in opencv.
    "controlnet_aux",
    "bitsandbytes",
    "pillow",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
qwen-image = "qwen_image.cli:main"

[tool.setuptools.packages.find]
include = ["qwen_image*"]

[tool.setuptools.package-data]
qwen_image = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
