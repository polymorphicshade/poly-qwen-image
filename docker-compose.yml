# poly-qwen-image on an NVIDIA GPU, over plain HTTP.
#
#   cp .env.example .env      # optional: port, variant, serve flags, ...
#   docker compose up -d --build
#   http://<host>:7860
#
# For HTTPS, use docker-compose.https.yml instead.

services:
  app:
    build: .
    image: poly-qwen-image:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:7860"
    environment:
      QWEN_IMAGE_VARIANT: ${QWEN_IMAGE_VARIANT:-gguf-q4_k_m}
      QWEN_IMAGE_SERVE_ARGS: ${QWEN_IMAGE_SERVE_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - outputs:/data/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:      # model weights (~10-60 GB depending on the variants used)
  outputs:     # generated images
